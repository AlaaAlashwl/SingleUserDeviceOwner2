name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle 8.2.1
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.2.1/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: .
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SingleUserDeviceOwner-Android12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
